{{- /* Small icons beside the home page headline numbers, after Figure 1b of the flagship paper. Input: datasets, modalities, participants or loci. */ -}}
{{- if eq . "datasets" -}}
<svg class="stat__ic" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="16" cy="7" rx="10" ry="3.5"/><path d="M6 7v18c0 2 4.5 3.5 10 3.5s10-1.5 10-3.5V7"/><path d="M6 13c0 2 4.5 3.5 10 3.5S26 15 26 13M6 19c0 2 4.5 3.5 10 3.5S26 21 26 19"/></g></svg>
{{- else if eq . "modalities" -}}
<svg class="stat__ic" viewBox="0 0 32 32" aria-hidden="true">{{ range $i, $m := slice "eQTL" "sQTL" "mQTL" "caQTL" "haQTL" "metQTL" "pQTL" "glycoQTL" }}<rect x="{{ add 2 (mul $i 3.6) }}" y="{{ cond (eq (mod $i 2) 0) 8 12 }}" width="2.6" height="{{ cond (eq (mod $i 2) 0) 18 14 }}" rx="1.3" style="fill: var(--m-{{ $m }})"/>{{ end }}</svg>
{{- else if eq . "participants" -}}
<svg class="stat__ic" viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><circle cx="11" cy="9" r="4"/><circle cx="22" cy="9" r="4"/><path d="M4 27c0-6 3-10 7-10s7 4 7 10zM15 27c0-6 3-10 7-10s7 4 7 10z"/></g></svg>
{{- else if eq . "loci" -}}
<svg class="stat__ic" viewBox="0 0 32 32" aria-hidden="true"><path d="M2 28h28" stroke="currentColor" stroke-width="1.6"/><g fill="currentColor"><rect x="3" y="22" width="2.4" height="6"/><rect x="7" y="19" width="2.4" height="9"/><rect x="11" y="23" width="2.4" height="5"/><rect x="15" y="20" width="2.4" height="8"/><rect x="23" y="21" width="2.4" height="7"/><rect x="27" y="23" width="2.4" height="5"/></g><rect x="19" y="5" width="2.4" height="23" style="fill: var(--m-glycoQTL)"/><path d="M2 11h28" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/></svg>
{{- end -}}
