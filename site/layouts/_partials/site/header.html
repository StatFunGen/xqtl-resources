<header class="topbar">
  <label for="nav-toggle" class="icon-btn topbar__menu" aria-label="Open menu" aria-controls="sidenav" aria-expanded="false" role="button" tabindex="0">
    <span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>
  </label>
  <a class="brand" href="{{ site.Home.RelPermalink }}">
    {{ partial "ui/logo.html" . }}
    <span class="brand__name">FunGen-xQTL <span class="brand__sub">Resources</span></span>
  </a>
  <div class="search" role="search">
    <span class="search__icon" aria-hidden="true"></span>
    <input id="book-search-input" type="search" enterkeyhint="search" maxlength="64"
      placeholder="Search all pages" aria-label="Search all pages" autocomplete="off">
    <kbd class="search__key" aria-hidden="true">/</kbd>
    <ul id="book-search-results" class="search__results" aria-live="polite"></ul>
  </div>
  <nav class="topbar__links" aria-label="FunGen-xQTL sites">
    <a href="{{ site.Home.RelPermalink }}" aria-current="{{ if .IsHome }}page{{ else }}true{{ end }}" class="is-current">Resources</a>
    <a href="{{ site.Params.protocolURL }}/">Protocol</a>
    <a href="{{ site.Params.explorerURL }}">Explorer</a>
    <a href="{{ site.Params.atlasURL }}" rel="noopener" title="NIAGADS site">xQTL Atlas ↗</a>
    <a href="{{ site.Params.repoURL }}" class="topbar__src">Source code</a>
  </nav>
  <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-label="Color theme: automatic" title="Color theme">
    <span class="theme-toggle__icon" aria-hidden="true"></span>
  </button>
</header>
